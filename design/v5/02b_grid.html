<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8"/>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 393px; height: 852px; overflow: hidden;
    font-family: -apple-system, 'SF Pro Text', 'PingFang SC', system-ui, sans-serif;
    background: #000; color: #fff; -webkit-font-smoothing: antialiased;
  }
  .phone { width: 393px; height: 852px; background: #000; position: relative; }
  .status {
    height: 54px; padding: 14px 24px 0;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 16px; font-weight: 600;
  }
  .nav {
    height: 44px; display: flex; align-items: center; padding: 0 8px; position: relative;
  }
  .back { color: #0A84FF; font-size: 17px; display:flex; align-items:center; gap:2px; padding: 8px; }
  .title { position:absolute; left:0; right:0; text-align:center; font-size:17px; font-weight:600; pointer-events:none; }
  .grid {
    padding: 8px 2px 110px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 2px;
  }
  .cell { aspect-ratio: 1; background: #1c1c1e; }
  .c1{background:linear-gradient(145deg,#0b1a33,#0A84FF)}
  .c2{background:linear-gradient(145deg,#2a1508,#FF9F0A)}
  .c3{background:linear-gradient(145deg,#0f2218,#30D158)}
  .c4{background:linear-gradient(145deg,#1a1028,#BF5AF2)}
  .c5{background:linear-gradient(145deg,#221018,#FF375F)}
  .c6{background:linear-gradient(145deg,#102028,#64D2FF)}
  .float-tab {
    position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%);
    width: 220px; height: 62px; border-radius: 31px;
    background: rgba(44,44,46,0.72);
    backdrop-filter: blur(40px) saturate(180%);
    -webkit-backdrop-filter: blur(40px) saturate(180%);
    border: 0.5px solid rgba(255,255,255,0.14);
    box-shadow: 0 10px 40px rgba(0,0,0,0.45), inset 0 0.5px 0 rgba(255,255,255,0.2);
    display: flex; align-items: center; justify-content: space-evenly; z-index: 10;
  }
  .ftab { width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;color:rgba(235,235,245,0.55)}
  .ftab.on { background: rgba(10,132,255,0.35); color:#fff }
  .home { position:absolute; bottom:8px; left:50%; transform:translateX(-50%); width:134px; height:5px; background:#fff; border-radius:3px; opacity:.9; z-index:11 }
</style>
</head>
<body>
<div class="phone">
  <div class="status"><span>9:41</span><span style="font-size:13px">■■■ ▾ ████</span></div>
  <div class="nav">
    <div class="back"><svg width="12" height="20" viewBox="0 0 12 20"><path d="M10 2L2 10l8 8" stroke="#0A84FF" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>浏览</div>
    <div class="title">灯光</div>
  </div>
  <div class="grid">
    <div class="cell c1"></div><div class="cell c2"></div><div class="cell c3"></div>
    <div class="cell c4"></div><div class="cell c5"></div><div class="cell c6"></div>
    <div class="cell c2"></div><div class="cell c1"></div><div class="cell c5"></div>
    <div class="cell c3"></div><div class="cell c6"></div><div class="cell c4"></div>
  </div>
  <div class="float-tab">
    <div class="ftab on"><svg width="22" height="22" viewBox="0 0 22 22" fill="currentColor"><path d="M3 6.5A2.5 2.5 0 015.5 4H9l1.2 1.2H16.5A2.5 2.5 0 0119 7.7V16a2.5 2.5 0 01-2.5 2.5h-11A2.5 2.5 0 013 16V6.5z"/></svg></div>
    <div class="ftab"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M11 4l1.2 3.6H16l-3 2.3 1.1 3.6L11 11.8 7.9 13.5l1.1-3.6-3-2.3h3.8L11 4z" stroke-linejoin="round"/></svg></div>
    <div class="ftab"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="8" r="3.2"/><path d="M4.5 18c1.2-3 3.5-4.5 6.5-4.5s5.3 1.5 6.5 4.5" stroke-linecap="round"/></svg></div>
  </div>
  <div class="home"></div>
</div>
</body>
</html>
