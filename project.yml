name: EagleBrowse

options:
  bundleIdPrefix: com.zekui
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  EagleBrowse:
    type: application
    platform: iOS
    sources:
      - path: Sources/EagleBrowseApp
      - path: Sources/EagleBrowseCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zekui.eaglebrowse
        INFOPLIST_KEY_CFBundleDisplayName: EagleBrowse
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: Sources/EagleBrowseApp/Info.plist
      properties:
        UILaunchScreen: {}

  EagleBrowseTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/EagleBrowseTests
    resources:
      - path: Tests/EagleBrowseTests/Fixtures
    dependencies:
      - target: EagleBrowse
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zekui.eaglebrowse.tests
        GENERATE_INFOPLIST_FILE: YES
