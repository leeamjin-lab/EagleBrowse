name: EagleBrowse

options:
  bundleIdPrefix: com.zekui
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  EagleBrowse:
    type: application
    platform: iOS
    sources:
      - path: Sources/EagleBrowseApp
        excludes:
          - Resources
      - path: Sources/EagleBrowseCore
      - path: Sources/EagleBrowseApp/Resources/demo.library
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zekui.eaglebrowse
        INFOPLIST_KEY_CFBundleDisplayName: EagleBrowse
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: Sources/EagleBrowseApp/Info.plist
      properties:
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: 连接你选择的 NAS，读取 Eagle 素材库及缩略图。
        NSBonjourServices: []
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true

  EagleBrowseTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/EagleBrowseTests
    resources:
      - path: Tests/EagleBrowseTests/Fixtures
    dependencies:
      - target: EagleBrowse
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zekui.eaglebrowse.tests
        GENERATE_INFOPLIST_FILE: YES
